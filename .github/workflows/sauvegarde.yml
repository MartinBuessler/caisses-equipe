name: Sauvegarde des caisses

# Les caisses vivent dans la base Firestore du projet atelier-2sa, ou elles sont
# ecrites a chaque changement depuis les telephones. Ce travail en ramene une copie
# dans le depot, pour que GitHub garde un historique lisible et restaurable.
#
#   - toutes les 30 minutes : copie dans data/, commitee si elle a bouge
#   - une fois par jour     : copie datee dans sauvegardes/AAAA-MM-JJ/
#   - a chaque execution    : archive telechargeable, gardee 90 jours
#
# Aucun secret n'est necessaire : la base se lit publiquement, comme depuis la page.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sauvegarde
  cancel-in-progress: false

jobs:
  sauvegarder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ramener les caisses depuis la base
        run: python3 outils/tirer-caisses.py

      - name: Verifier chaque caisse ramenee
        run: |
          for f in data/*.json; do
            python3 outils/verifier-caisse.py "$f" || { echo "::error::$f est illisible"; exit 1; }
          done

      - name: Copie datee, une fois par jour
        run: |
          JOUR=$(date -u +%Y-%m-%d)
          echo "JOUR=$JOUR" >> "$GITHUB_ENV"
          if [ ! -d "sauvegardes/$JOUR" ]; then
            mkdir -p "sauvegardes/$JOUR"
            cp data/*.json "sauvegardes/$JOUR/"
          fi
          ls -1d sauvegardes/*/ 2>/dev/null | sort | head -n -60 | xargs -r rm -rf

      - name: Commiter ce qui a bouge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data sauvegardes
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Sauvegarde des caisses"
          git push

      - name: Archive telechargeable, conservee 90 jours
        uses: actions/upload-artifact@v4
        with:
          name: caisses-${{ env.JOUR }}-${{ github.run_number }}
          path: data/*.json
          retention-days: 90
